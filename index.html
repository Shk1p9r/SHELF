<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHELF — Premium Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --success: #10b981;
      --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --danger: #ef4444;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 120px;
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 90;
      padding: 12px 16px;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-login-sm {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .product-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    .product-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 10px;
    }

    .product-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .product-price {
      font-size: 17px;
      font-weight: 800;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      white-space: nowrap;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .options-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .option-group-label {
      font-size: 12px;
      color: var(--text-muted);
      width: 100%;
      margin-bottom: -4px;
    }

    .size-chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .size-chip.selected {
      background: var(--accent);
      border-color: var(--accent);
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s;
    }

    .color-dot.selected {
      border-color: #fff;
      transform: scale(1.15);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      color: white;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--card-border);
      margin-top: 10px;
    }

    .btn-success {
      background: var(--success-gradient);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      padding: 0 16px;
    }

    .bottom-nav {
      background: rgba(15, 21, 36, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      display: flex;
      padding: 6px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      gap: 4px;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 10px 8px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .cart-badge {
      background: var(--accent);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .app-footer {
      margin-top: 35px;
      padding: 20px 10px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .footer-link {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: #fff;
    }

    .footer-legal-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 11px;
      opacity: 0.7;
    }

    .footer-credits {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-body {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-width: 450px;
      max-height: 80vh;
      overflow-y: auto;
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.6;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: rgba(10, 15, 26, 0.7);
      border: 1px solid var(--card-border);
      color: white;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .admin-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 26, 0.6);
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title">SHELF</div>
    <div id="user-header-status"></div>
  </div>

  <div class="container" id="app-content">
    <div class="empty-state"><p>Загрузка приложения...</p></div>
  </div>

  <div class="bottom-nav-wrapper">
    <div class="bottom-nav">
      <button class="nav-btn active" id="nav-catalog" onclick="switchTab('catalog')">
        <span>🛒</span>
        <span>Каталог</span>
      </button>
      <button class="nav-btn" id="nav-cart" onclick="switchTab('cart')">
        <span>🛍</span>
        <span>Корзина <span id="cart-count" class="cart-badge">0</span></span>
      </button>
      <button class="nav-btn" id="nav-admin" style="display:none;" onclick="switchTab('admin')">
        <span>🔑</span>
        <span>Продавец</span>
      </button>
    </div>
  </div>

  <!-- Legal Modal -->
  <div id="legal-modal" class="modal-overlay" style="display:none;">
    <div class="modal-body">
      <div class="modal-title" id="modal-legal-title">Документ</div>
      <div id="modal-legal-content"></div>
      <button class="btn btn-secondary" style="margin-top:16px;" onclick="closeLegalModal()">Закрыть</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vcneretrcmboehngbqjy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WZU_tUJbkdF9iezNHxepwA_iGdDYffd";
    
    const SUPER_ADMINS = [5134404754, 5889214841];
    const ALL_SIZES = ['S', 'M', 'L', 'XL', 'XXL'];

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let currentUser = tg?.initDataUnsafe?.user || JSON.parse(localStorage.getItem('shelf_user') || 'null');
    let currentUserId = currentUser ? Number(currentUser.id) : 0;

    let adminList = [...SUPER_ADMINS];
    let cart = [];
    let settings = { card_number: '', phone_number: '' };
    let cachedProducts = [];
    let cachedOrders = [];
    let currentTab = 'catalog';

    // Временное хранение выбранных опций для товаров в каталоге
    let selectedProductOptions = {};

    async function init() {
      if (tg?.initDataUnsafe?.user) {
        currentUser = tg.initDataUnsafe.user;
        currentUserId = Number(currentUser.id);
        localStorage.setItem('shelf_user', JSON.stringify(currentUser));
      }

      renderUserHeaderStatus();

      await Promise.all([
        loadAdmins(),
        loadSettings(),
        preloadData()
      ]);

      if (currentUserId > 0 && adminList.includes(currentUserId)) {
        document.getElementById('nav-admin').style.display = 'flex';
      } else {
        document.getElementById('nav-admin').style.display = 'none';
      }

      switchTab(currentTab);
    }

    async function preloadData() {
      try {
        const [prodRes, ordRes] = await Promise.all([
          db.from('products').select('*').order('created_at', { ascending: false }),
          db.from('orders').select('*').order('created_at', { ascending: false })
        ]);
        if (prodRes.data) cachedProducts = prodRes.data;
        if (ordRes.data) cachedOrders = ordRes.data;
      } catch (e) {
        console.error("Ошибка загрузки данных:", e);
      }
    }

    function renderUserHeaderStatus() {
      const el = document.getElementById('user-header-status');
      if (currentUserId > 0 && currentUser) {
        const name = currentUser.username ? `@${currentUser.username}` : (currentUser.first_name || 'Пользователь');
        const photo = currentUser.photo_url || 'https://telegram.org/img/t_logo.png';
        el.innerHTML = `
          <div class="user-pill">
            <img src="${photo}" class="user-avatar" alt="Avatar">
            <span>${name}</span>
            <button class="btn-login-sm" onclick="logout()" style="background:rgba(239,68,68,0.2); color:#f87171; margin-left:4px;">Выйти</button>
          </div>
        `;
      } else {
        el.innerHTML = `
          <div class="user-pill">
            <span>👀 Гость</span>
            <button class="btn-login-sm" onclick="showAuthPrompt()">Войти</button>
          </div>
        `;
      }
    }

    async function loadAdmins() {
      try {
        const { data } = await db.from('shelf_admins').select('telegram_user_id');
        if (data && Array.isArray(data)) {
          const dbAdmins = data.map(row => Number(row.telegram_user_id));
          adminList = Array.from(new Set([...SUPER_ADMINS, ...dbAdmins]));
        }
      } catch (e) {
        adminList = [...SUPER_ADMINS];
      }
    }

    async function loadSettings() {
      try {
        const { data } = await db.from('settings').select('value').eq('key', 'payment_info').maybeSingle();
        if (data && data.value) {
          settings = data.value;
        }
      } catch (e) {}
    }

    function showAuthPrompt() {
      const idStr = prompt("Введите ваш Telegram ID для авторизации:");
      if (!idStr) return;
      const id = Number(idStr.trim());
      if (isNaN(id) || id <= 0) {
        alert("Неверный ID!");
        return;
      }
      currentUser = { id: id, first_name: `User ${id}`, username: `user_${id}` };
      currentUserId = id;
      localStorage.setItem('shelf_user', JSON.stringify(currentUser));
      init();
    }

    function logout() {
      localStorage.removeItem('shelf_user');
      currentUser = null;
      currentUserId = 0;
      renderUserHeaderStatus();
      init();
    }

    function getFooterHTML() {
      return `
        <div class="app-footer">
          <div class="footer-links">
            <a href="https://t.me/SHELFstore1" target="_blank" class="footer-link">📢 Канал SHELF</a>
            <a href="https://t.me/SHELFotz" target="_blank" class="footer-link">💬 Отзывы</a>
            <a href="https://www.avito.ru/brands/82408a3b639091b8eb0dabc4d797b316?src=sharing" target="_blank" class="footer-link">🛍 Авито</a>
          </div>
          <div class="footer-legal-links">
            <span style="cursor:pointer; text-decoration:underline;" onclick="openLegalModal('terms')">Пользовательское соглашение</span> • 
            <span style="cursor:pointer; text-decoration:underline;" onclick="openLegalModal('privacy')">Конфиденциальность</span>
          </div>
          <div class="footer-credits">
            Разработано студией <b>ELEVEN_PROJECT</b> | Кодер: <b>shk1p9r</b>
          </div>
        </div>
      `;
    }

    function openLegalModal(type) {
      const modal = document.getElementById('legal-modal');
      const title = document.getElementById('modal-legal-title');
      const content = document.getElementById('modal-legal-content');

      if (type === 'terms') {
        title.innerText = 'Пользовательское соглашение';
        content.innerHTML = `
          <p><b>1. Общие положения</b><br>Используя магазин SHELF, вы соглашаетесь с условиями покупки товара и правилами оформления заказов.</p>
          <p style="margin-top:8px;"><b>2. Заказы и Оплата</b><br>Все заказы подтверждаются продавцом. Продавец имеет право отменить бронь при некорректных данных.</p>
          <p style="margin-top:8px;"><b>3. Права</b><br>Все права на дизайн и товарные марки принадлежат магазину SHELF и разработчикам ELEVEN_PROJECT.</p>
        `;
      } else {
        title.innerText = 'Политика конфиденциальности';
        content.innerHTML = `
          <p><b>1. Сбор данных</b><br>Мы обрабатываем необходимые данные вашего аккаунта исключительно для авторизации и доставки заказов.</p>
          <p style="margin-top:8px;"><b>2. Защита данных</b><br>Персональные данные не передаются третьим лицам и надежно защищены.</p>
        `;
      }
      modal.style.display = 'flex';
    }

    function closeLegalModal() {
      document.getElementById('legal-modal').style.display = 'none';
    }

    function selectProductOption(productId, type, value) {
      if (!selectedProductOptions[productId]) {
        selectedProductOptions[productId] = { size: 'S', color: '' };
      }
      selectedProductOptions[productId][type] = value;
      switchTab('catalog');
    }

    function addColorPickerField(hex = '#6366f1', name = '') {
      const container = document.getElementById('colors-container');
      const item = document.createElement('div');
      item.className = 'color-item';
      item.style.display = 'flex';
      item.style.gap = '8px';
      item.style.marginBottom = '8px';
      item.innerHTML = `
        <input type="color" value="${hex}" style="width: 50px; padding: 4px; height: 46px; cursor: pointer;" class="color-picker-input">
        <input type="text" placeholder="Название цвета (например, Черный)" value="${name}" class="color-name-input" style="margin-bottom: 0;">
        <button type="button" class="btn btn-danger" style="width: auto; padding: 0 14px;" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(item);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) activeNav.classList.add('active');

      const container = document.getElementById('app-content');

      if (tab === 'catalog') {
        const products = cachedProducts;
        if (!products || products.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">✨</div>
              <p>Каталог пока пуст</p>
            </div>
            ${getFooterHTML()}
          `;
          return;
        }

        container.innerHTML = `
          <div class="product-grid">
            ${products.map(p => {
              const sizes = Array.isArray(p.sizes) ? p.sizes : [];
              const colors = Array.isArray(p.colors) ? p.colors : [];
              
              if (!selectedProductOptions[p.id]) {
                selectedProductOptions[p.id] = {
                  size: sizes[0] || 'S',
                  color: colors[0] ? colors[0].hex : ''
                };
              }
              const currentOpts = selectedProductOptions[p.id];

              return `
                <div class="product-card">
                  ${p.image ? `<img src="${p.image}" class="product-img" alt="${p.title}">` : ''}
                  <div class="product-header-row">
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">${p.price} ₽</div>
                  </div>
                  <div class="product-desc">${p.description \vert{}\vert{} ''}</div>${sizes.length > 0 ? `
                    <div class="options-row">
                      <div class="option-group-label">Размер:</div>
                      ${sizes.map(s => `
                        <div class="size-chip ${currentOpts.size === s ? 'selected' : ''}" onclick="selectProductOption(${p.id}, 'size', '${s}')">${s}</div>
                      `).join('')}
                    </div>
                  ` : ''}

                  ${colors.length > 0 ? `
                    <div class="options-row">
                      <div class="option-group-label">Цвет:</div>
                      ${colors.map(c => `
                        <div class="color-dot ${currentOpts.color === c.hex ? 'selected' : ''}" style="background-color: ${c.hex};" title="${c.name || c.hex}" onclick="selectProductOption(${p.id}, 'color', '${c.hex}')"></div>
                      `).join('')}
                    </div>
                  ` : ''}

                  <button class="btn" onclick="addToCart(${p.id}, '${p.title.replace(/'/g, "\\'")}', ${p.price})">
                    В корзину
                  </button>
                </div>
              `;
            }).join('')}
          </div>
          ${getFooterHTML()}
        `;
      } 
      else if (tab === 'cart') {
        if (!cart || cart.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🛍</div>
              <p>Ваша корзина пуста</p>
            </div>
            ${getFooterHTML()}
          `;
          return;
        }
        const total = cart.reduce((s, i) => s + i.price, 0);
        container.innerHTML = `
          <div class="section-card">
            <div class="section-title">Ваш заказ</div>
            ${cart.map((item, index) => `
              <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:12px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">
                <div>
                  <div style="font-weight:600; color:#fff;">${item.title}</div>
                  <div style="font-size:12px; color:var(--text-muted);">Размер: ${item.size || '—'} | Цвет: <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${item.color};"></span></div>
                  <div style="color:#34d399; font-weight:700; font-size:14px; margin-top:2px;">${item.price} ₽</div>
                </div>
                <button onclick="removeFromCart(${index})" style="color:var(--danger); background:none; border:none; font-size:20px; cursor:pointer; padding:5px;">✕</button>
              </div>
            `).join('')}
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; font-size:18px; font-weight:800; color:#fff;">
              <span>Итого:</span>
              <span style="color:#34d399;">${total} ₽</span>
            </div>
          </div>
          <button class="btn btn-success" onclick="openCheckout()">Оформить заказ</button>
          ${getFooterHTML()}
        `;
      } 
      else if (tab === 'admin') {
        if (!currentUserId || !adminList.includes(currentUserId)) {
          container.innerHTML = `
            <div class="section-card" style="text-align: center; padding: 30px 20px;">
              <div class="empty-icon">🔒</div>
              <h3 style="color:#fff; margin-bottom:8px;">Доступ ограничен</h3>
              <p style="font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:16px;">
                У вас нет прав администратора. Авторизуйтесь под своим Telegram ID:
              </p>
              <button class="btn" onclick="showAuthPrompt()">Авторизоваться</button>
            </div>
            ${getFooterHTML()}
          `;
          return;
        }

        const orders = cachedOrders;
        const products = cachedProducts;

        container.innerHTML = `
          <div class="section-card">
            <div class="section-title">🔑 Реквизиты оплаты</div>
            <input id="set-card" value="${settings.card_number || ''}" placeholder="Номер карты">
            <input id="set-phone" value="${settings.phone_number || ''}" placeholder="Номер телефона">
            <button class="btn" onclick="saveSettings()">Сохранить реквизиты</button>
          </div>

          <div class="section-card">
            <div class="section-title">👥 Управление администраторами</div>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Добавить Telegram ID сотрудника:</p>
            <input id="new-admin-id" type="number" placeholder="Telegram ID">
            <button class="btn btn-secondary" style="margin-top:0; margin-bottom:15px;" onclick="addAdmin()">+ Добавить администратора</button>
            
            <div style="font-size:13px; font-weight:700; color:#fff; margin-bottom:8px;">Список админов:</div>
            ${adminList.map(id => `
              <div class="admin-list-item">
                <span style="font-size:13px; font-weight:600;">ID: ${id}${SUPER_ADMINS.includes(id) ? '👑 (Владелец)' : ''}</span>
                ${!SUPER_ADMINS.includes(id) ? `
                  <button class="btn btn-danger" style="width:auto; padding:4px 10px; font-size:11px;" onclick="removeAdmin(${id})">Удалить</button>
                ` : ''}
              </div>
            `).join('')}
          </div>

          <div class="section-card">
            <div class="section-title">📦 Управление заказами</div>
            ${orders.map(o => `
              <div style="background:rgba(10, 15, 26, 0.6); border:1px solid var(--card-border); padding:12px; margin-bottom:10px; border-radius:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                  <b>Заказ #${o.id}</b>
                  <span style="font-size:12px; color:var(--text-muted);">${o.payment_method === 'online' ? '💳 Перевод' : '💵 Наличные'}</span>
                </div>
                <div style="font-size:13px; color:var(--text-muted); margin-bottom:4px;">Покупатель: <b style="color:#fff;">${o.user_name}</b> (${o.user_phone})</div>
                <div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Сумма: <b style="color:#34d399;">${o.total_price || o.total_amount || 0} ₽</b></div>
                <div style="font-size:12px; margin-bottom:8px;">Статус: <b>${o.status === 'pending' ? '⏳ Ожидает проверки' : o.status === 'paid' ? '✅ Оплачен' : '💵 Бронь'}</b></div>
                ${o.status === 'pending' ? `
                  <button class="btn btn-success" style="padding:10px;" onclick="updateOrderStatus(${o.id}, 'paid')">Подтвердить оплату</button>
                ` : ''}
              </div>
            `).join('') || '<p style="color:var(--text-muted); font-size:13px;">Заказов пока нет</p>'}
          </div>

          <div class="section-card">
            <div class="section-title">➕ Добавить товар</div>
            <input id="p-title" placeholder="Название товара">
            <input id="p-price" type="number" placeholder="Цена (руб)">
            
            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Доступные размеры (S - XXL):</label>
            <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
              ${ALL_SIZES.map(s => `
                <label style="display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer;">
                  <input type="checkbox" name="product-size" value="${s}" checked style="width:auto; margin:0;"> ${s}
                </label>
              `).join('')}
            </div>

            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px;">Расцветки (RGBA / Палитра):</label>
            <div id="colors-container" style="margin-bottom:8px;"></div>
            <button type="button" class="btn btn-secondary" style="margin-top:0; margin-bottom:12px;" onclick="addColorPickerField()">+ Добавить расцветку</button>

            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Фото товара:</label>
            <input id="p-img-file" type="file" accept="image/*">
            <textarea id="p-desc" placeholder="Описание товара"></textarea>
            <button class="btn" onclick="addProduct()">Добавить в каталог</button>
          </div>

          <div class="section-card">
            <div class="section-title">🏷 Текущие товары</div>
            ${products.map(p => `
              <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(10, 15, 26, 0.6); padding:10px 14px; margin-bottom:8px; border-radius:10px; border:1px solid var(--card-border);">
                <div>
                  <div style="font-weight:700; color:#fff;">${p.title}</div>
                  <div style="color:#34d399; font-size:13px; font-weight:700;">${p.price} ₽</div>
                </div>
                <button class="btn btn-danger" style="width:auto; padding:8px 14px; font-size:12px;" onclick="deleteProduct(${p.id})">Удалить</button>
              </div>
            `).join('') || '<p style="color:var(--text-muted); font-size:13px;">Товаров нет</p>'}
          </div>
          ${getFooterHTML()}
        `;
        // Добавим дефолтный цвет при открытии админки
        if (document.getElementById('colors-container').children.length === 0) {
          addColorPickerField('#000000', 'Черный');
        }
      }
    }

    async function addAdmin() {
      const input = document.getElementById('new-admin-id');
      const newId = Number(input.value.trim());
      if (!newId || isNaN(newId)) {
        alert("Введите корректный числовой Telegram ID!");
        return;
      }
      if (adminList.includes(newId)) {
        alert("Этот администратор уже добавлен!");
        return;
      }
      await db.from('shelf_admins').insert({ telegram_user_id: newId, is_super_admin: false });
      adminList.push(newId);
      alert(`Администратор ${newId} успешно добавлен!`);
      switchTab('admin');
    }

    async function removeAdmin(id) {
      if (SUPER_ADMINS.includes(id)) {
        alert("Нельзя удалить владельца!");
        return;
      }
      if (confirm(`Удалить администратора ${id}?`)) {
        await db.from('shelf_admins').delete().eq('telegram_user_id', id);
        adminList = adminList.filter(a => a !== id);
        switchTab('admin');
      }
    }

    function addToCart(id, title, price) {
      const opts = selectedProductOptions[id] || { size: 'S', color: '#000000' };
      cart.push({ 
        product_id: id, 
        id, 
        title, 
        price, 
        size: opts.size, 
        color: opts.color 
      });
      document.getElementById('cart-count').innerText = cart.length;
      if (tg) tg.HapticFeedback?.impactOccurred('light');
      alert('Товар добавлен в корзину!');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      document.getElementById('cart-count').innerText = cart.length;
      switchTab('cart');
    }

    function openCheckout() {
      const container = document.getElementById('app-content');
      const total = cart.reduce((s, i) => s + i.price, 0);
      container.innerHTML = `
        <div class="section-card">
          <div class="section-title">Оформление заказа</div>
          <input id="u-name" placeholder="Ваше Имя" value="${currentUser?.first_name || ''}">
          <input id="u-phone" placeholder="Ваш телефон для связи">
          <div style="font-size:14px; font-weight:700; margin: 15px 0 10px 0; color:#fff;">Способ оплаты:</div>
          <button class="btn" onclick="processOrder('cash')">💵 Наличными при получении</button>
          <button class="btn btn-secondary" onclick="showOnlinePayment(${total})">💳 Онлайн перевод по реквизитам</button>
        </div>
      `;
    }

    function showOnlinePayment(total) {
      const container = document.getElementById('app-content');
      const name = document.getElementById('u-name')?.value;
      const phone = document.getElementById('u-phone')?.value;

      container.innerHTML = `
        <div class="section-card">
          <div class="section-title">Перевод по реквизитам</div>
          <p style="font-size:14px; color:var(--text-muted); margin-bottom:15px;">Переведите <b style="color:#34d399;">${total} ₽</b> на указанные реквизиты:</p>
          <div style="background:rgba(10, 15, 26, 0.8); padding:14px; border-radius:12px; margin-bottom:15px; border:1px solid var(--card-border);">
            <div style="margin-bottom:8px;">💳 Номер карты: <b style="font-size:15px; color:#fff; display:block; margin-top:4px;">${settings.card_number}</b></div>
            <div>📱 Телефон: <b style="font-size:15px; color:#fff; display:block; margin-top:4px;">${settings.phone_number}</b></div>
          </div>
          <button class="btn btn-success" onclick="processOrder('online', '${name}', '${phone}')">Я оплатил</button>
        </div>
      `;
    }

    async function processOrder(method, customName, customPhone) {
      const name = customName || document.getElementById('u-name')?.value || currentUser?.first_name || 'Покупатель';
      const phone = customPhone || document.getElementById('u-phone')?.value || 'Не указан';
      const total = cart.reduce((s, i) => s + i.price, 0);

      await db.from('orders').insert({
        telegram_user_id: currentUserId,
        username: currentUser?.username || name,
        user_name: name,
        user_phone: phone,
        items: cart,
        total_price: total,
        payment_method: method,
        status: method === 'online' ? 'pending' : 'cash_reserved'
      });

      cart = [];
      document.getElementById('cart-count').innerText = '0';
      await preloadData();

      if (method === 'online') {
        document.getElementById('app-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon" style="color:#fbbf24;">⏳</div>
            <h2 style="color:#fff; margin-bottom:8px;">Оплата проверяется</h2>
            <p>Продавец проверяет поступивший перевод.</p>
          </div>
        `;
      } else {
        document.getElementById('app-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon" style="color:#34d399;">✅</div>
            <h2 style="color:#fff; margin-bottom:8px;">Заказ забронирован!</h2>
            <p>Продавец свяжется с вами по указанному номеру.</p>
          </div>
        `;
      }
    }

    async function saveSettings() {
      const card = document.getElementById('set-card').value;
      const phone = document.getElementById('set-phone').value;
      settings = { card_number: card, phone_number: phone };
      await db.from('settings').upsert({ key: 'payment_info', value: settings }, { onConflict: 'key' });
      alert('Реквизиты сохранены!');
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;
            
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    }

    async function addProduct() {
      const title = document.getElementById('p-title').value;
      const price = document.getElementById('p-price').value;
      const fileInput = document.getElementById('p-img-file');
      const description = document.getElementById('p-desc').value;

      if (!title || !price) {
        alert('Заполните название и цену!');
        return;
      }

      // Сбор выбранных размеров
      const sizes = Array.from(document.querySelectorAll('input[name="product-size"]:checked')).map(el => el.value);

      // Сбор расцветок
      const colors = [];
      document.querySelectorAll('.color-item').forEach(item => {
        const hex = item.querySelector('.color-picker-input').value;
        const name = item.querySelector('.color-name-input').value.trim();
        colors.push({ hex, name: name || hex });
      });

      let image = "";
      if (fileInput.files && fileInput.files[0]) {
        image = await compressImage(fileInput.files[0]);
      }

      await db.from('products').insert({ 
        title, 
        price: parseFloat(price), 
        image, 
        description, 
        sizes, 
        colors, 
        is_available: true 
      });

      alert('Товар успешно добавлен!');
      await preloadData();
      switchTab('admin');
    }

    async function deleteProduct(id) {
      if (confirm('Удалить этот товар?')) {
        await db.from('products').delete().eq('id', id);
        await preloadData();
        switchTab('admin');
      }
    }

    async function updateOrderStatus(orderId, status) {
      await db.from('orders').update({ status }).eq('id', orderId);
      await preloadData();
      switchTab('admin');
    }

    init();
  </script>
</body>
</html>
