<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHELF — Premium Store</title>
  <!-- SDK Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --success: #10b981;
      --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --danger: #ef4444;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 120px;
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 90;
      padding: 12px 16px;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .product-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    .product-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 10px;
    }

    .product-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .product-price {
      font-size: 17px;
      font-weight: 800;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      white-space: nowrap;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .size-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .size-btn.selected {
      background: var(--accent);
      border-color: #8b5cf6;
      color: #fff;
    }

    .badge-preorder {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
      display: inline-block;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      color: white;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--card-border);
      margin-top: 10px;
    }

    .btn-success {
      background: var(--success-gradient);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      padding: 0 16px;
    }

    .bottom-nav {
      background: rgba(15, 21, 36, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      display: flex;
      padding: 6px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      gap: 4px;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 10px 8px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .cart-badge {
      background: var(--accent);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .app-footer {
      margin-top: 35px;
      padding: 20px 10px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .footer-link {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-legal-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 11px;
      opacity: 0.7;
    }

    .footer-credits {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-body {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-width: 450px;
      max-height: 80vh;
      overflow-y: auto;
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.6;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: rgba(10, 15, 26, 0.7);
      border: 1px solid var(--card-border);
      color: white;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .admin-list-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(10, 15, 26, 0.6);
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .order-status {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .status-confirmed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title">SHELF</div>
    <div id="user-header-status"></div>
  </div>

  <div class="container" id="app-content"></div>

  <div class="bottom-nav-wrapper">
    <div class="bottom-nav">
      <button class="nav-btn active" id="nav-catalog" onclick="switchTab('catalog')">
        <span>🛒</span>
        <span>Каталог</span>
      </button>
      <button class="nav-btn" id="nav-cart" onclick="switchTab('cart')">
        <span>🛍</span>
        <span>Корзина <span id="cart-count" class="cart-badge">0</span></span>
      </button>
      <button class="nav-btn" id="nav-admin" style="display:none;" onclick="switchTab('admin')">
        <span>🔑</span>
        <span>Продавец</span>
      </button>
    </div>
  </div>

  <div id="legal-modal" class="modal-overlay" style="display:none;">
    <div class="modal-body">
      <div class="modal-title" id="modal-legal-title">Документ</div>
      <div id="modal-legal-content"></div>
      <button class="btn btn-secondary" style="margin-top:16px;" onclick="closeLegalModal()">Закрыть</button>
    </div>
  </div>

  <script>
    // Обновленные данные новой базы Supabase
    const SUPABASE_URL = "https://whqicbrivhiaegtzelci.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FfYb_P8kESdDW8I488cYtA_UPFlPSi8";
    const SUPER_ADMINS = [5134404754, 5889214841];

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentUser = tg?.initDataUnsafe?.user || JSON.parse(localStorage.getItem('shelf_user') || 'null');
    let currentUserId = currentUser ? Number(currentUser.id) : 0;

    let adminList = [...SUPER_ADMINS];
    let cart = [];
    let settings = { card_number: '', phone_number: '' };
    let selectedSizes = {};

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function init() {
      if (tg?.initDataUnsafe?.user) {
        currentUser = tg.initDataUnsafe.user;
        currentUserId = Number(currentUser.id);
        localStorage.setItem('shelf_user', JSON.stringify(currentUser));
      }

      await loadAdmins();
      await loadSettings();
      renderUserHeaderStatus();

      if (currentUserId > 0 && adminList.includes(currentUserId)) {
        document.getElementById('nav-admin').style.display = 'flex';
      } else {
        document.getElementById('nav-admin').style.display = 'none';
      }

      switchTab('catalog');
    }

    function renderUserHeaderStatus() {
      const el = document.getElementById('user-header-status');
      if (currentUserId > 0 && currentUser) {
        const name = currentUser.username ? `@${currentUser.username}` : (currentUser.first_name || 'Покупатель');
        const photo = currentUser.photo_url || 'https://telegram.org/img/t_logo.png';
        el.innerHTML = `
          <div class="user-pill">
            <img src="${escapeHtml(photo)}" class="user-avatar" alt="Avatar">
            <span>${escapeHtml(name)}</span>
          </div>
        `;
      } else {
        el.innerHTML = `
          <div class="user-pill">
            <span>👀 Гость</span>
          </div>
        `;
      }
    }

    async function loadAdmins() {
      try {
        const { data } = await db.from('settings').select('value').eq('key', 'admin_ids').maybeSingle();
        if (data && data.value && Array.isArray(data.value)) {
          adminList = Array.from(new Set([...SUPER_ADMINS, ...data.value.map(Number)]));
        }
      } catch (e) {
        console.error("Ошибка загрузки админов:", e);
      }
    }

    async function saveAdmins() {
      try {
        const customAdmins = adminList.filter(id => !SUPER_ADMINS.includes(id));
        await db.from('settings').upsert({ key: 'admin_ids', value: customAdmins });
      } catch (e) {
        console.error("Ошибка сохранения админов:", e);
      }
    }

    async function loadSettings() {
      try {
        const { data } = await db.from('settings').select('*');
        if (data) {
          data.forEach(item => {
            if (item.key === 'payment_info' && item.value) {
              settings = item.value;
            }
          });
        }
      } catch (e) {
        console.error("Ошибка настроек:", e);
      }
    }

    function getFooterHTML() {
      return `
        <div class="app-footer">
          <div class="footer-links">
            <a href="https://t.me/SHELFstore1" target="_blank" class="footer-link">📢 Telegram SHELF</a>
            <a href="https://t.me/SHELFstore1" target="_blank" class="footer-link" style="color:#34d399;">💬 Отзывы покупателей</a>
            <a href="https://www.avito.ru/brands/82408a3b639091b8eb0dabc4d797b316?src=sharing" target="_blank" class="footer-link">🛍 Авито Продавец</a>
          </div>
          <div class="footer-legal-links">
            <span style="cursor:pointer; text-decoration:underline;" onclick="openLegalModal('terms')">Пользовательское соглашение</span> • 
            <span style="cursor:pointer; text-decoration:underline;" onclick="openLegalModal('privacy')">Конфиденциальность</span>
          </div>
          <div class="footer-credits">
            Разработано студией <b>ELEVEN_PROJECT</b> | Кодер: <b>shk1p9r</b>
          </div>
        </div>
      `;
    }

    function openLegalModal(type) {
      const modal = document.getElementById('legal-modal');
      const title = document.getElementById('modal-legal-title');
      const content = document.getElementById('modal-legal-content');

      if (type === 'terms') {
        title.innerText = 'Пользовательское соглашение';
        content.innerHTML = `
          <p><b>1. Предмет соглашения</b><br>Настоящее соглашение регулирует порядок использования Telegram Mini App «SHELF» для бронирования и оформления заказов одежды и аксессуаров.</p>
          <p style="margin-top:8px;"><b>2. Оформление заказа и бронь</b><br>Оформляя бронь через приложение, Покупатель подтверждает намерение приобрести выбранный товар. Подтверждение заказа и параметры доставки согласовываются с Администратором в Telegram.</p>
          <p style="margin-top:8px;"><b>3. Возврат и обмен</b><br>Обмен и возврат товара осуществляется в соответствии с действующим законодательством РФ при сохранении товарного вида и ярлыков.</p>
        `;
      } else {
        title.innerText = 'Политика конфиденциальности';
        content.innerHTML = `
          <p><b>1. Сбор и обработка данных</b><br>Приложение обрабатывает минимальный набор публичных данных пользователя Telegram (ID, Имя, Username, номер телефона), необходимый исключительно для обработки и подтверждения заказа.</p>
          <p style="margin-top:8px;"><b>2. Безопасность данных</b><br>Мы не передаем ваши персональные данные третьим лицам. Все данные используются строго в рамках обслуживания вашего заказа в магазине SHELF.</p>
          <p style="margin-top:8px;"><b>3. Согласие</b><br>Используя данный Mini App, вы выражаете свое согласие на обработку указанных данных для связи с вами по вопросам заказов.</p>
        `;
      }
      modal.style.display = 'flex';
    }

    function closeLegalModal() {
      document.getElementById('legal-modal').style.display = 'none';
    }

    function selectSize(productId, size, btnEl) {
      selectedSizes[productId] = size;
      const parent = btnEl.parentElement;
      parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
    }

    async function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) activeNav.classList.add('active');

      const container = document.getElementById('app-content');

      if (tab === 'catalog') {
        container.innerHTML = `<div class="empty-state"><p>Загрузка каталога...</p></div>`;
        const { data: products, error } = await db.from('products').select('*').order('created_at', { ascending: false });
        
        if (error || !products || products.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">✨</div>
              <p>Каталог пока пуст</p>
            </div>
            ${getFooterHTML()}
          `;
          return;
        }

        container.innerHTML = `
          <div class="product-grid">
            ${products.map(p => {
              const sizes = p.sizes ? (typeof p.sizes === 'string' ? p.sizes.split(',') : p.sizes).map(s => String(s).trim()).filter(Boolean) : [];
              const isPreorder = p.category === 'preorder';
              const isOutOfStock = p.is_available === false;
              const img = p.image || p.image_url || '';

              return `
                <div class="product-card">
                  ${img ? `<img src="${escapeHtml(img)}" class="product-img" alt="${escapeHtml(p.title)}">` : ''}
                  ${isPreorder ? `<div class="badge-preorder">⌛ Предзаказ (доставка 7-14 дней)</div>` : ''}
                  <div class="product-header-row">
                    <div class="product-title">${escapeHtml(p.title)}</div>
                    <div class="product-price">${p.price} ₽</div>
                  </div>
                  <div class="product-desc">${escapeHtml(p.description \vert{}\vert{} '')}</div>${sizes.length > 0 ? `
                    <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Выберите размер:</div>
                    <div class="size-selector">
                      ${sizes.map(size => `
                        <button class="size-btn ${selectedSizes[p.id] === size ? 'selected' : ''}" onclick="selectSize(${p.id}, '${escapeHtml(size)}', this)">${escapeHtml(size)}</button>
                      `).join('')}
                    </div>
                  ` : ''}

                  <button class="btn" ${isOutOfStock ? 'disabled' : ''} onclick="addToCart(${p.id}, '${escapeHtml(p.title)}', ${p.price},${sizes.length > 0})">
                    ${isOutOfStock ? 'Нет в наличии' : (isPreorder ? 'Забронировать (Предзаказ)' : 'В корзину')}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
          ${getFooterHTML()}
        `;
      } 
      else if (tab === 'cart') {
        if (!cart || cart.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🛍</div>
              <p>Ваша корзина пуста</p>
            </div>
            ${getFooterHTML()}
          `;
          return;
        }
        const total = cart.reduce((s, i) => s + i.price, 0);
        container.innerHTML = `
          <div class="section-card">
            <div class="section-title">Ваш заказ</div>
            ${cart.map((item, index) => `
              <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:12px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">
                <div>
                  <div style="font-weight:600; color:#fff;">${escapeHtml(item.title)}${item.size ? `<span style="color:#a5b4fc; font-size:12px;"> (Размер: ${escapeHtml(item.size)})</span>` : ''}</div>
                  <div style="color:#34d399; font-weight:700; font-size:14px;">${item.price} ₽</div>
                </div>
                <button onclick="removeFromCart(${index})" style="color:var(--danger); background:none; border:none; font-size:20px; cursor:pointer; padding:5px;">✕</button>
              </div>
            `).join('')}
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; font-size:18px; font-weight:800; color:#fff;">
              <span>Итого:</span>
              <span style="color:#34d399;">${total} ₽</span>
            </div>
          </div>
          <button class="btn btn-success" onclick="openCheckout()">Оформить заказ / Забронировать</button>
          ${getFooterHTML()}
        `;
      } 
      else if (tab === 'admin') {
        if (!currentUserId || !adminList.includes(currentUserId)) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🔒</div>
              <h3 style="color:#fff; margin-bottom:8px;">Доступ ограничен</h3>
              <p style="font-size:13px; color:var(--text-muted);">У вас нет прав продавца.</p>
            </div>
            ${getFooterHTML()}
          `;
          return;
        }

        container.innerHTML = `<div class="empty-state"><p>Загрузка панели управления...</p></div>`;
        const { data: orders } = await db.from('orders').select('*').order('created_at', { ascending: false });
        const { data: products } = await db.from('products').select('*').order('created_at', { ascending: false });

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span style="font-size:12px; color:var(--text-muted);">Админ: <b style="color:#fff;">${escapeHtml(currentUser?.first_name || currentUserId)}</b></span>
          </div>

          <div class="section-card">
            <div class="section-title">📦 Поступившие заказы / Брони</div>
            ${orders && orders.length > 0 ? orders.map(o => {
              const uName = o.username || o.user_name || 'Покупатель';
              const uPhone = o.user_phone || 'Не указан';
              const amount = o.total_price || o.total_amount || 0;
              return `
              <div class="admin-list-item">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <b>Заказ #${o.id}</b>
                  <span class="order-status ${o.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">
                    ${o.status === 'confirmed' ? 'Подтвержден' : 'Ожидает оплаты/бронь'}
                  </span>
                </div>
                <div style="font-size:12px; color:var(--text-muted);">
                  Покупатель: <b>${escapeHtml(uName)}</b> (${o.telegram_user_id || o.user_id ? `@${uName}` : 'Гость'})<br>
                  Тел: ${escapeHtml(uPhone)}
                </div>
                <div style="font-size:13px; margin:4px 0; color:#fff;">
                  <b>Товары:</b>
                  ${Array.isArray(o.items) ? o.items.map(i => `<br>• ${escapeHtml(i.title)} ${i.size ? `(Размер: ${escapeHtml(i.size)})` : ''} - ${i.price} ₽`).join('') : ''}
                </div>
                <div style="font-size:14px; font-weight:800; color:#34d399;">Сумма: ${amount} ₽</div>
                <div style="display:flex; gap:8px; margin-top:6px;">
                  <button class="btn btn-success" style="padding:6px; font-size:12px;" onclick="updateOrderStatus(${o.id}, 'confirmed')">✓ Подтвердить</button>
                  <button class="btn btn-danger" style="padding:6px; font-size:12px;" onclick="updateOrderStatus(${o.id}, 'cancelled')">✕ Отменить</button>
                </div>
              </div>
            `}).join('') : '<p style="color:var(--text-muted); font-size:13px;">Заказов пока нет</p>'}
          </div>

          <div class="section-card">
            <div class="section-title">➕ Добавить товар</div>
            <input id="p-title" placeholder="Название товара">
            <input id="p-price" type="number" placeholder="Цена (руб)">
            <input id="p-sizes" placeholder="Размеры через запятую (например: S, M, L, XL)">
            <select id="p-availability">
              <option value="all">В наличии</option>
              <option value="preorder">Предзаказ</option>
            </select>
            <input id="p-img-file" type="file" accept="image/*">
            <textarea id="p-desc" placeholder="Описание товара"></textarea>
            <button id="btn-add-product" class="btn" onclick="addProduct()">Загрузить и добавить</button>
          </div>

          <div class="section-card">
            <div class="section-title">🔑 Реквизиты оплаты</div>
            <input id="set-card" value="${escapeHtml(settings.card_number || '')}" placeholder="Номер карты">
            <input id="set-phone" value="${escapeHtml(settings.phone_number || '')}" placeholder="Номер телефона">
            <button class="btn" onclick="saveSettings()">Сохранить реквизиты</button>
          </div>

          <div class="section-card">
            <div class="section-title">👥 Управление администраторами</div>
            <input id="new-admin-id" type="number" placeholder="Telegram ID сотрудника">
            <button class="btn btn-secondary" style="margin-bottom:15px;" onclick="addAdmin()">+ Добавить администратора</button>
            ${adminList.map(id => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0;">
                <span>ID: ${id}${SUPER_ADMINS.includes(id) ? ' 👑' : ''}</span>
                ${!SUPER_ADMINS.includes(id) ? `<button class="btn btn-danger" style="width:auto; padding:4px 10px;" onclick="removeAdmin(${id})">Удалить</button>` : ''}
              </div>
            `).join('')}
          </div>

          <div class="section-card">
            <div class="section-title">🏷 Товары в каталоге</div>
            ${products?.map(p => `
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid var(--card-border); padding-bottom:6px;">
                <div><b>${escapeHtml(p.title)}</b> (${p.price} ₽)</div>
                <button class="btn btn-danger" style="width:auto; padding:6px 12px;" onclick="deleteProduct(${p.id})">Удалить</button>
              </div>
            `).join('') || '<p style="color:var(--text-muted);">Товаров нет</p>'}
          </div>
          ${getFooterHTML()}
        `;
      }
    }

    function addToCart(id, title, price, hasSizes) {
      if (hasSizes && !selectedSizes[id]) {
        alert('Пожалуйста, выберите размер товара!');
        return;
      }
      cart.push({ id, title, price, size: selectedSizes[id] || null });
      document.getElementById('cart-count').innerText = cart.length;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      document.getElementById('cart-count').innerText = cart.length;
      switchTab('cart');
    }

    function openCheckout() {
      const container = document.getElementById('app-content');
      const total = cart.reduce((s, i) => s + i.price, 0);
      container.innerHTML = `
        <div class="section-card">
          <div class="section-title">Оформление заказа</div>
          <input id="u-name" placeholder="Ваше Имя" value="${escapeHtml(currentUser?.first_name || '')}">
          <input id="u-phone" placeholder="Ваш телефон для связи">
          <button class="btn" onclick="processOrder('cash')">💵 Забронировать (Оплата наличными)</button>
          <button class="btn btn-secondary" onclick="showOnlinePayment(${total})">💳 Онлайн перевод по реквизитам</button>
        </div>
      `;
    }

    function showOnlinePayment(total) {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="section-card">
          <div class="section-title">Перевод по реквизитам</div>
          <p style="font-size:14px; color:var(--text-muted); margin-bottom:15px;">Переведите <b style="color:#34d399;">${total} ₽</b> на реквизиты:</p>
          <div style="background:rgba(10, 15, 26, 0.8); padding:14px; border-radius:12px; margin-bottom:15px; border:1px solid var(--card-border);">
            <div>💳 Карта: <b style="color:#fff;">${escapeHtml(settings.card_number || 'Не указана')}</b></div>
            <div style="margin-top:6px;">📱 Телефон: <b style="color:#fff;">${escapeHtml(settings.phone_number || 'Не указан')}</b></div>
          </div>
          <button class="btn btn-success" onclick="processOrder('online')">Я оплатил</button>
        </div>
      `;
    }

    async function processOrder(method) {
      const name = document.getElementById('u-name')?.value || currentUser?.first_name || 'Покупатель';
      const phone = document.getElementById('u-phone')?.value || 'Не указан';
      const total = cart.reduce((s, i) => s + i.price, 0);

      await db.from('orders').insert({
        telegram_user_id: currentUserId,
        username: currentUser?.username || name,
        items: cart,
        total_price: total,
        status: method === 'online' ? 'pending' : 'cash_reserved'
      });

      cart = [];
      document.getElementById('cart-count').innerText = '0';
      document.getElementById('app-content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon" style="color:#34d399;">✅</div>
          <h2>Заказ успешно принят!</h2>
          <p style="margin-bottom:16px;">Продавец скоро свяжется с вами в Telegram.</p>
          <a href="https://t.me/SHELFstore1" target="_blank" class="btn btn-secondary" style="display:inline-flex; width:auto; padding:10px 18px; text-decoration:none;">
            💬 Почитать отзывы в нашем ТГК
          </a>
        </div>
      `;
    }

    async function updateOrderStatus(orderId, status) {
      await db.from('orders').update({ status }).eq('id', orderId);
      switchTab('admin');
    }

    async function uploadImageToStorage(file) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const filePath = `products/${fileName}`;

      const { data, error } = await db.storage.from('products').upload(filePath, file);
      if (error) {
        // Если Storage Bucket еще не создан, возвращаем заглушку или ошибку
        console.warn("Storage upload warning, fallback to placeholder", error);
        return 'https://via.placeholder.com/600x600/111827/FFFFFF?text=SHELF';
      }

      const { data: publicUrlData } = db.storage.from('products').getPublicUrl(filePath);
      return publicUrlData.publicUrl;
    }

    async function addProduct() {
      const title = document.getElementById('p-title').value.trim();
      const price = document.getElementById('p-price').value.trim();
      const sizes = document.getElementById('p-sizes').value.trim();
      const category = document.getElementById('p-availability').value;
      const fileInput = document.getElementById('p-img-file');
      const description = document.getElementById('p-desc').value.trim();
      const btn = document.getElementById('btn-add-product');

      if (!title || !price) {
        alert('Укажите название и цену!');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Загрузка...";

      try {
        let image = "https://via.placeholder.com/600x600/111827/FFFFFF?text=SHELF";
        if (fileInput.files && fileInput.files[0]) {
          image = await uploadImageToStorage(fileInput.files[0]);
        }

        const sizesArray = sizes ? sizes.split(',').map(s => s.trim()) : [];

        await db.from('products').insert({ 
          title, 
          price: parseFloat(price), 
          image, 
          description,
          sizes: sizesArray,
          category,
          is_available: true
        });

        alert('Товар успешно добавлен!');
        switchTab('admin');
      } catch (e) {
        alert('Ошибка при сохранении: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Загрузить и добавить";
      }
    }

    async function deleteProduct(id) {
      if (confirm('Удалить товар?')) {
        await db.from('products').delete().eq('id', id);
        switchTab('catalog');
      }
    }

    async function saveSettings() {
      const card = document.getElementById('set-card').value;
      const phone = document.getElementById('set-phone').value;
      await db.from('settings').upsert({ key: 'payment_info', value: { card_number: card, phone_number: phone } });
      alert('Реквизиты сохранены!');
      loadSettings();
    }

    async function addAdmin() {
      const input = document.getElementById('new-admin-id');
      const newId = Number(input.value.trim());
      if (!newId || isNaN(newId)) return;
      if (!adminList.includes(newId)) {
        adminList.push(newId);
        await saveAdmins();
        switchTab('admin');
      }
    }

    async function removeAdmin(id) {
      if (confirm(`Удалить админа ${id}?`)) {
        adminList = adminList.filter(a => a !== id);
        await saveAdmins();
        switchTab('admin');
      }
    }

    init();
  </script>
</body>
</html>
